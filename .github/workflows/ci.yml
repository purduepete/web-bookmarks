name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    client:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: src/WebBookmarks.Client
        steps:
            - uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '20'
                  cache: npm
                  cache-dependency-path: src/WebBookmarks.Client/package-lock.json

            - name: Install
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npx tsc -b

            - name: Test
              run: npm test

    api:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: '9.0.x'

            - name: Build API
              run: dotnet build src/WebBookmarks.Api/WebBookmarks.Api.csproj -c Release
