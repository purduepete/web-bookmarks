<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <!-- iOS ignores an SVG favicon when adding to the home screen and needs this PNG. -->
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="Web Bookmarks" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <title>Web Bookmarks</title>

        <!-- Pre-paint background: the app is always dark (App.css sets body
             #020617), but that CSS only applies after the JS bundle loads and
             the head's remote CDN stylesheets are render-blocking. Paint the
             dark canvas immediately so cold loads never flash white (FOUC fix,
             matching webportfolio/webinventory/fittrack). -->
        <style>
            html,
            body {
                margin: 0;
                min-height: 100%;
                background-color: #020617;
                color: #b2bac2;
            }
        </style>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            crossorigin="anonymous"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
