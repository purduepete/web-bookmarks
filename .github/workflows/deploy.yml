name: Deploy WebBookmarks

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

env:
    AZURE_RESOURCE_GROUP: jimbpersonal-rg
    API_APP_NAME: webbookmarksapi

jobs:
    deploy-api:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v6

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: '9.0.x'

            - name: Restore & Build API
              run: dotnet publish src/WebBookmarks.Api/WebBookmarks.Api.csproj -c Release -o ./api-publish

            - name: Login to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Deploy API to App Service
              uses: azure/webapps-deploy@v3
              with:
                  app-name: ${{ env.API_APP_NAME }}
                  package: ./api-publish

            - name: Smoke test (health probe)
              shell: bash
              run: |
                  url="https://${{ env.API_APP_NAME }}.azurewebsites.net/healthz"
                  echo "Probing $url"
                  for i in {1..10}; do
                    code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
                    echo "Attempt $i: HTTP $code"
                    if [ "$code" = "200" ]; then
                      echo "API is healthy."
                      exit 0
                    fi
                    sleep 15
                  done
                  echo "Health check failed after retries."
                  exit 1

    deploy-client:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '20'

            - name: Install & Build Client
              working-directory: src/WebBookmarks.Client
              run: |
                  npm ci
                  npm run build

            - name: Deploy to Static Web Apps
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
                  action: upload
                  app_location: src/WebBookmarks.Client
                  output_location: dist
